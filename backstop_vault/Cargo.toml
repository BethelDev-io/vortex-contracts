[package]
name = "vortex-backstop-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

# `backstop_vault` is not a member of the repository's root workspace, and the
# root manifest currently cannot be loaded at all (it lists two members whose
# directories do not exist — `directory` and `arbiter_panel`; issues #554 /
# #555).  Declaring this crate as its own workspace root keeps it
# independently buildable and testable, and gives it its own `Cargo.lock`,
# exactly like the other contract crates in the tree
# (`intent_settlement/Cargo.lock`, `proof_registry/Cargo.lock`,
# `solver_registry/Cargo.lock`).
[workspace]
