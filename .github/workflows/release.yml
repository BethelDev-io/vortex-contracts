name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Ensure CI checks pass before releasing
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    name: Build release artifacts and publish
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            intent_settlement
            proof_registry
            solver_registry
            reputation_badge
            governor
            backstop_vault
            fee_router
            intent_periphery
            timelock
            treasury_streams

      # Build every contract crate to release wasm, collect into dist/ and checksum.
      # Add new crates to CRATES; no other workflow edits are required.
      - name: Build release wasm and compute checksums
        run: |
          set -e
          CRATES="intent_settlement proof_registry solver_registry reputation_badge governor backstop_vault fee_router intent_periphery timelock treasury_streams"
          mkdir -p dist

          for crate in $CRATES; do
            (cd "$crate" && CARGO_TARGET_DIR="$PWD/target" cargo build --target wasm32-unknown-unknown --release)
            # Package name -> wasm filename: hyphens become underscores
            pkg=$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$crate/Cargo.toml" | head -n1 | tr '-' '_')
            cp "$crate/target/wasm32-unknown-unknown/release/$pkg.wasm" dist/
          done

          echo "SHA256 checksums for release ${{ github.ref_name }}" > SHASUMS256.txt
          echo "" >> SHASUMS256.txt
          (cd dist && sha256sum *.wasm) >> SHASUMS256.txt

          echo "=== Checksums ==="
          cat SHASUMS256.txt

      # Extract release notes from CHANGELOG.md
      - name: Extract release notes
        id: release_notes
        run: |
          # Extract version from tag (e.g., v1.2.3 -> 1.2.3)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Try to find and extract the section for this version from CHANGELOG.md
          # Look for ## [VERSION] or ## version pattern
          RELEASE_NOTES=$(awk "
            /^## \[?$VERSION\]?/ {found=1; next}
            found && /^## / {exit}
            found {print}
          " CHANGELOG.md | sed '/^$/d' | head -n -1)

          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="See CHANGELOG.md for details about this release."
          fi

          # Use environment file to handle multiline content safely
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_ENV

      # Create GitHub Release with artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.wasm
            SHASUMS256.txt
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Post checksums to job summary for verification
      - name: Post verification summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## Release Artifacts

          ✓ Successfully built and published release ${{ github.ref_name }}

          ### Artifacts
          - One `.wasm` per contract crate (see `SHASUMS256.txt`)
          - `SHASUMS256.txt`

          ### Verification
          Download the `.wasm` files from the release and verify checksums:

          ```bash
          # Download SHASUMS256.txt from the release
          sha256sum -c SHASUMS256.txt
          ```

          All checksums should print `OK`. These signed artifacts are reproducible
          and match the ones generated by `./verify-build.sh` run locally with Rust 1.78.0.
          EOF
