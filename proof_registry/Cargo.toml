[package]
name = "vortex-proof-registry"
version = "0.1.0"
edition = "2021"
publish = false

# `rlib` in addition to `cdylib` so `intent_settlement` can depend on this
# crate as a library (for `ProofRegistryClient`) while `stellar contract build`
# still emits the cdylib wasm (issue #190).
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }

[features]
testutils = ["soroban-sdk/testutils"]

# `cargo-fuzz` target for the manual byte-level payload/VAA parsers
# (`receive_message`, chain-ID and amount decoding). Run with:
#   cargo +nightly fuzz run proof_registry_parse
# The target lives in `proof_registry/fuzz/` and is excluded from the
# workspace so it does not affect `stellar contract build` (issue #563).
[workspace]
exclude = ["fuzz"]
